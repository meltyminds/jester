<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скоро открытие</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --brand-purple:#584A99;
    --brand-tan:#9C8E85;
    --brand-gold:#C9A227;
    --brand-crimson:#8B1E1E;
    --brand-parchment:#F7F3EC;

    --bg: var(--brand-parchment);
    --figure: var(--brand-purple);
    --sign-bg: var(--brand-crimson);
    --sign-text: var(--brand-parchment);
    --sign-border: var(--brand-gold);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(16px,3vh,32px);
    padding:clamp(20px,4vh,40px) 20px;
    background:var(--bg);
    color:#2E2A26;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    transition:background-color .35s ease;
  }

  .sign{
    display:inline-flex;
    align-items:center;
    gap:.6em;
    padding:.55em 1.4em;
    background:var(--sign-bg);
    color:var(--sign-text);
    border:1px solid var(--sign-border);
    border-radius:999px;
    font-size:clamp(15px,2.6vw,22px);
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    box-shadow:0 6px 18px rgba(139,30,30,.25);
    transition:background-color .35s ease, color .35s ease, border-color .35s ease;
  }
  .sign::before, .sign::after{
    content:"\2726";
    color:var(--sign-border);
    font-size:.85em;
  }

  .stage-wrap{
    width:min(560px,86vw,58vh);
    aspect-ratio:1244 / 1000;
    position:relative;
    color:var(--figure);
    transition:color .35s ease;
  }
  .stage{ position:absolute; inset:0; }
  #body{ position:absolute; inset:0; transform-origin:50% 64%; will-change:transform; }
  #head{ position:absolute; left:11.25%; top:3.4%; width:78.94%; height:89%; transform-origin:49.1% 88.3%; will-change:transform; }
  .frame{ position:absolute; left:0; top:0; width:100%; height:100%; opacity:0; }
  .frame svg{ display:block; }
  #f4{ top:-0.3%; height:101.9%; }
  #handL, #handR{ position:absolute; left:0; top:6%; width:100%; height:94%; will-change:transform; }
  #handL{ transform-origin:32.15% 52.13%; }
  #handR{ transform-origin:67.85% 52.13%; }
  #handL svg, #handR svg{ display:block; }

  .pickers{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:clamp(16px,4vw,40px);
  }
  .picker{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .picker span{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#6b655c; }
  .swatches{ display:flex; gap:8px; }
  .swatch{
    width:26px; height:26px;
    border-radius:50%;
    border:2px solid rgba(0,0,0,.12);
    cursor:pointer;
    padding:0;
    box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .swatch[aria-pressed="true"]{
    border-color:#2E2A26;
    box-shadow:0 0 0 2px var(--brand-parchment), 0 0 0 4px #2E2A26;
  }

  footer{
    font-size:13px;
    color:#6b655c;
    text-align:center;
  }

  @media (prefers-color-scheme: dark){
    body{ color:#EDE8DF; }
    .swatch[aria-pressed="true"]{ box-shadow:0 0 0 2px #1b1815, 0 0 0 4px #EDE8DF; }
    footer{ color:#9b948a; }
    .picker span{ color:#9b948a; }
  }
</style>
</head>
<body>
  <div class="sign">Скоро открытие</div>

  <div class="stage-wrap">
    <div class="stage">
      <div id="body">
        <div id="head">
          <div class="frame" id="f1"></div>
          <div class="frame" id="f2"></div>
          <div class="frame" id="f3"></div>
          <div class="frame" id="f4"></div>
        </div>
        <div id="handL"></div>
        <div id="handR"></div>
      </div>
    </div>
  </div>

  <div class="pickers">
    <div class="picker">
      <span>Фон</span>
      <div class="swatches" data-palette="background" data-var="--bg" data-default="parchment"></div>
    </div>
    <div class="picker">
      <span>Персонаж</span>
      <div class="swatches" data-palette="brand" data-var="--figure" data-default="brand-purple"></div>
    </div>
    <div class="picker">
      <span>Вывеска</span>
      <div class="swatches" data-palette="brand" data-mode="sign" data-default="brand-crimson"></div>
    </div>
  </div>

  <script>
  (function(){
    document.getElementById('year').textContent = new Date().getFullYear();

    var BRAND = {
      'brand-purple':'#584A99',
      'brand-tan':'#9C8E85',
      'brand-gold':'#C9A227',
      'brand-crimson':'#8B1E1E',
      'brand-parchment':'#F7F3EC',
      'black':'#000000'
    };

    var BACKGROUND = {
      'parchment':'#F7F3EC',
      'tan':'#9C8E85',
      'black':'#000000',
      'brand-purple':'#584A99'
    };

    // The sign stays bold, so each background gets a pre-paired text/border
    // color that keeps it legible instead of picking those independently.
    var SIGN_PAIR = {
      '#584A99': { text:'#F7F3EC', border:'#C9A227' },
      '#9C8E85': { text:'#F7F3EC', border:'#8B1E1E' },
      '#C9A227': { text:'#8B1E1E', border:'#584A99' },
      '#8B1E1E': { text:'#F7F3EC', border:'#C9A227' },
      '#F7F3EC': { text:'#8B1E1E', border:'#C9A227' },
      '#000000': { text:'#F7F3EC', border:'#C9A227' }
    };

    document.querySelectorAll('.swatches').forEach(function(group){
      var palette = group.dataset.palette === 'background' ? BACKGROUND : BRAND;
      var isSign = group.dataset.mode === 'sign';
      var cssVar = group.dataset.var;
      var current = palette[group.dataset.default];
      Object.keys(palette).forEach(function(name){
        var hex = palette[name];
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'swatch';
        btn.style.background = hex;
        btn.title = name;
        btn.setAttribute('aria-pressed', hex === current ? 'true' : 'false');
        btn.addEventListener('click', function(){
          if (isSign) {
            var pair = SIGN_PAIR[hex] || SIGN_PAIR['#8B1E1E'];
            document.documentElement.style.setProperty('--sign-bg', hex);
            document.documentElement.style.setProperty('--sign-text', pair.text);
            document.documentElement.style.setProperty('--sign-border', pair.border);
          } else {
            document.documentElement.style.setProperty(cssVar, hex);
          }
          group.querySelectorAll('.swatch').forEach(function(b){ b.setAttribute('aria-pressed', 'false'); });
          btn.setAttribute('aria-pressed', 'true');
        });
        group.appendChild(btn);
      });
    });

    async function inflate(b64){
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    }

    function startAnimation(){
      var el = {
        b: document.getElementById('body'),
        head: document.getElementById('head'),
        hl: document.getElementById('handL'),
        hr: document.getElementById('handR'),
        frames: [1,2,3,4].map(function(n){ return document.getElementById('f'+n); })
      };
      var cur = 0;
      var t0 = performance.now();
      var speed = 1, swing = 52, bounce = true;
      var period = 3400 / Math.max(0.15, speed);

      function easeOutBack(u){ var c1 = 1.28, c3 = c1 + 1, k = u - 1; return 1 + c3*k*k*k + c1*k*k; }
      function easeInOut(u){ return u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3)/2; }

      function tick(now){
        requestAnimationFrame(tick);
        var t = (now - t0) / 1000;
        var p = ((now - t0) % period) / period;

        var s;
        if (p < 0.40) s = easeOutBack(p/0.40);
        else if (p < 0.62) s = 1;
        else s = 1 - easeInOut((p - 0.62)/0.38);
        s = Math.max(0, Math.min(1.08, s));

        var o;
        if (p < 0.30) o = easeInOut(p/0.30);
        else if (p < 0.66) o = 1;
        else o = 1 - easeInOut(Math.min(1, (p - 0.66)/0.34));

        var seq = [0,0,0,1,1,1,2,2,2,3];
        var idx = seq[Math.max(0, Math.min(seq.length - 1, Math.floor(o*seq.length)))];
        if (idx !== cur){
          el.frames[cur].style.opacity = '0';
          el.frames[idx].style.opacity = '1';
          cur = idx;
        }

        var shudder = Math.sin(t * 21) * o;
        var by = bounce ? (-18*o + 4*shudder) : 0;
        var bs = bounce ? (1 + 0.014*o) : 1;
        el.b.style.transform = 'translateY(' + (by/10).toFixed(3) + '%) scale(' + bs.toFixed(4) + ')';

        var tilt = -5.2*o + 0.8*shudder;
        el.head.style.transform = 'translateY(' + ((-7*o)/9.4).toFixed(3) + '%) rotate(' + tilt.toFixed(2) + 'deg)';

        var a = swing * (1 - s);
        var lift = (-98*(1 - s) + 3*shudder) / 9.4;
        el.hl.style.transform = 'translateY(' + lift.toFixed(3) + '%) rotate(' + (-a).toFixed(2) + 'deg)';
        el.hr.style.transform = 'translateY(' + lift.toFixed(3) + '%) rotate(' + a.toFixed(2) + 'deg)';
      }
      el.frames[0].style.opacity = '1';
      requestAnimationFrame(tick);
    }

    async function init(){
      var assets = JSON.parse(document.getElementById('assets').textContent);
      var mounts = {
        f1: document.getElementById('f1'),
        f2: document.getElementById('f2'),
        f3: document.getElementById('f3'),
        f4: document.getElementById('f4'),
        handL: document.getElementById('handL'),
        handR: document.getElementById('handR')
      };
      await Promise.all(Object.keys(assets).map(async function(key){
        mounts[key].innerHTML = await inflate(assets[key]);
      }));
      startAnimation();
    }

    init().catch(function(err){ console.error('Failed to load animation assets:', err); });
  })();
  </script>
</body>
</html>
